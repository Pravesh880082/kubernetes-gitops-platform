apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-api-deployment
spec:
  replicas: 2

  selector:
    matchLabels:
      app: gitops-api

  template:
    metadata:
      labels:
        app: gitops-api

    spec:
      containers:
        - name: gitops-api
          image: pravesh880082/kubernetes-gitops-platform:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
