name: CI/CD - Kubernetes GitOps Platform

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t pravesh880082/kubernetes-gitops-platform:latest \
            -f app/dockerfile app

      - name: Push Docker image
        run: |
          docker push pravesh880082/kubernetes-gitops-platform:latestname: CI/CD - Kubernetes GitOps Platform

